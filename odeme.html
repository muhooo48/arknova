<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARK NOVA | Ödeme</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}

.menu-btn{
position:fixed;
top:20px;
right:20px;
background:#2dff6c;
color:black;
text-decoration:none;
padding:12px 20px;
border-radius:10px;
font-weight:bold;
}

.menu-btn:hover{
background:#26d85d;
}

header{
background:#1c1c1c;
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
color:#2dff6c;
}

.box{
max-width:700px;
margin:50px auto;
background:#1f1f1f;
padding:35px;
border-radius:15px;
}

h2{
color:#2dff6c;
margin-bottom:20px;
}

label{
display:block;
margin-top:20px;
margin-bottom:8px;
font-weight:bold;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
}

.toplam{
margin-top:30px;
font-size:24px;
font-weight:bold;
color:#2dff6c;
}

button{
margin-top:30px;
width:100%;
padding:16px;
background:#2dff6c;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#26d85d;
}

</style>

</head>

<body>

<a href="index.html" class="menu-btn">🏠 Menü</a>

<header>
💳 ARK NOVA Ödeme
</header>

<div class="box">

<h2>🛒 Sipariş Özeti</h2>

<p id="urunler">Sepetiniz yükleniyor...</p>

<div class="toplam">
Toplam: <span id="toplam">0 TL</span>
</div>

<label>🎮 Oyun İçi Kullanıcı Adı</label>
<input type="text" placeholder="Kullanıcı adınızı girin">

<label>💬 Discord Kullanıcı Adı</label>
<input type="text" placeholder="Örn: Kullanici#1234">

<label>📧 E-Posta (İsteğe Bağlı)</label>
<input type="email" placeholder="ornek@mail.com">

<button onclick="alert('Ödeme sistemi yakında aktif olacak.')">
💳 Ödemeye Devam Et
</button>

</div>

<script>

let sepet = JSON.parse(localStorage.getItem("sepet")) || [];

let liste = "";
let toplam = 0;

for(let i=0;i<sepet.length;i++){

liste += "• " + sepet[i].isim + " - " + sepet[i].fiyat + " TL<br>";

toplam += sepet[i].fiyat;

}

if(sepet.length==0){

liste="Sepetiniz boş.";

}

document.getElementById("urunler").innerHTML=liste;

document.getElementById("toplam").innerHTML=toplam+" TL";

</script>

</body>
</html>
