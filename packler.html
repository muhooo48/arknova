<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARK NOVA | Packler</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}

header{
background:#1c1c1c;
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
color:#2dff6c;
}

.container{
display:flex;
justify-content:center;
gap:40px;
flex-wrap:wrap;
padding:60px;
}

.card{
width:300px;
background:#1f1f1f;
border-radius:15px;
padding:30px;
text-align:center;
transition:.3s;
border:2px solid transparent;
}

.card:hover{
transform:translateY(-10px);
border-color:#2dff6c;
box-shadow:0 0 25px #2dff6c;
}

.card h2{
margin-bottom:15px;
color:#2dff6c;
}

.card p{
margin:10px 0;
}

.price{
font-size:35px;
font-weight:bold;
color:#2dff6c;
margin:20px 0;
}

button{
background:#2dff6c;
border:none;
padding:15px 35px;
font-size:18px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#26d85d;
}

/* Bildirim */
#bildirim{
display:none;
position:fixed;
top:30px;
right:30px;
background:#2dff6c;
color:#111;
padding:15px 25px;
border-radius:10px;
font-weight:bold;
}
</style>

</head>

<body>

<header>📦 ARK NOVA Packler</header>


<div class="container">


<div class="card">
<h2>🔥 Magmasaurus Pack</h2>
<p>2× Magmasaurus</p>
<div class="price">275 TL</div>
<button onclick="sepeteEkle('Magmasaurus Pack')">Satın Al</button>
</div>


<div class="card">
<h2>🦖 R-Giga Pack</h2>
<p>2× R-Giga</p>
<div class="price">325 TL</div>
<button onclick="sepeteEkle('R-Giga Pack')">Satın Al</button>
</div>


<div class="card">
<h2>🦷 Carcharo Pack</h2>
<p>2× Carcharodontosaurus</p>
<div class="price">300 TL</div>
<button onclick="sepeteEkle('Carcharo Pack')">Satın Al</button>
</div>


<div class="card">
<h2>🛡️ Tank Kiti</h2>
<p>2× Stego</p>
<p>2× Carbonemys</p>
<p>2× Paraceratherium</p>
<p>2× Trike</p>
<div class="price">250 TL</div>
<button onclick="sepeteEkle('Tank Kiti')">Satın Al</button>
</div>


</div>


<div id="bildirim"></div>


<script>

function sepeteEkle(urun){

let bildirim=document.getElementById("bildirim");

bildirim.innerHTML="✅ "+urun+" sepete eklendi!";

bildirim.style.display="block";


setTimeout(function(){

bildirim.style.display="none";

},2000);

}

</script>


</body>
</html>
