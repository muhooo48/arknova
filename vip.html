<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARK NOVA | VIP</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}

header{
background:#1c1c1c;
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
color:#2dff6c;
}

.container{
display:flex;
justify-content:center;
gap:40px;
flex-wrap:wrap;
padding:60px;
}

.card{
width:300px;
background:#1f1f1f;
border-radius:15px;
padding:30px;
text-align:center;
transition:.3s;
border:2px solid transparent;
}

.card:hover{
transform:translateY(-10px);
border-color:#2dff6c;
box-shadow:0 0 25px #2dff6c;
}

h2{
margin-bottom:15px;
}

.price{
font-size:35px;
color:#2dff6c;
margin:20px 0;
font-weight:bold;
}

button{
background:#2dff6c;
border:none;
padding:15px 35px;
font-size:18px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#26d85d;
}

/* Sepete eklendi bildirimi */
#bildirim{
display:none;
position:fixed;
top:30px;
right:30px;
background:#2dff6c;
color:#111;
padding:15px 25px;
border-radius:10px;
font-weight:bold;
}
</style>

</head>

<body>

<header>👑 ARK NOVA VIP Mağazası</header>

<div class="container">

<div class="card">
<h2>VIP</h2>
<p>Sunucuda başlangıç avantajları.</p>
<div class="price">150 TL</div>
<button onclick="sepeteEkle('VIP',150)">Satın Al</button>
</div>


<div class="card">
<h2>VIP DoDo</h2>
<p>Daha güçlü avantajlar ve özel içerikler.</p>
<div class="price">250 TL</div>
<button onclick="sepeteEkle('VIP DoDo',250)">Satın Al</button>
</div>


<div class="card">
<h2>VIP Boss</h2>
<p>En yüksek seviye VIP paketi.</p>
<div class="price">400 TL</div>
<button onclick="sepeteEkle('VIP Boss',400)">Satın Al</button>
</div>

</div>


<div id="bildirim"></div>


<script>

function sepeteEkle(urun,fiyat){

alert("Çalıştı: " + urun);

let sepet = JSON.parse(localStorage.getItem("sepet")) || [];

sepet.push({
isim: urun,
fiyat: fiyat
});

localStorage.setItem("sepet", JSON.stringify(sepet));

let bildirim=document.getElementById("bildirim");

bildirim.innerHTML="✅ "+urun+" sepete eklendi!";
bildirim.style.display="block";

setTimeout(function(){
bildirim.style.display="none";
},2000);

}
